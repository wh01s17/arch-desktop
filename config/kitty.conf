include colors.conf
font_family MesloLGS Nerd Font Mono
bold_font MesloLGS Nerd Font Mono Bold
italic_font MesloLGS Nerd Font Mono Italic
bold_italic_font MesloLGS Nerd Font Mono Bold Italic
background_opacity 0.85
window_padding_width 10
window_padding_height 10
tab_bar_margin_width 9
tab_bar_margin_height 9 0
tab_bar_style separator
tab_bar_min_tabs 1
tab_separator ""
tab_title_template "{fmt.fg.color8}{fmt.bg.default}{fmt.fg.color7}{fmt.bg.color8}{index} ⌘ {title[:15] + (title[15:] and '…')}{fmt.fg.color8}{fmt.bg.default} "
active_tab_title_template "{fmt.fg.color2}{fmt.bg.default}{fmt.fg.color0}{fmt.bg.color2}{index} ⌘ {fmt.noitalic}{title[:100] + (title[100:] and '…')}{fmt.fg.color2}{fmt.bg.default} "
shell /usr/bin/zsh
globinclude machine-profile.conf
